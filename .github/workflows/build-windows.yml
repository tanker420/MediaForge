# ============================================================
#  MediaForge Windows 安装包构建（GitHub Actions）
#  触发方式：
#   1. 手动触发（Actions 页面点 Run workflow）
#   2. 推送 v* 标签（如 v1.0.0），自动构建并发布 Release
# ============================================================
name: 构建 Windows 安装包

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（默认从 git describe 读取）"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 执行构建脚本
        shell: powershell
        run: |
          # 注意：GitHub Actions 的 powershell 是 5.1，且原生命令非零退出码
          # 会让步骤直接失败。这里刻意避免 `git describe`（无 tag 时退出码 128），
          # 改用不会失败的 `git tag --list` 取版本号。
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $tag = git tag --list 'v*' --sort=-v:refname 2>$null | Select-Object -First 1
            if ($tag) { $ver = $tag.TrimStart('v') } else { $ver = "1.0.0" }
          }
          powershell -ExecutionPolicy Bypass -File packaging\ci\build.ps1 -Version $ver

      - name: 上传安装包（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup
          path: dist_installer/*.exe
          if-no-files-found: error

      - name: 发布 Release（推送标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
          generate_release_notes: true
