# ============================================================
#  [参考模板] Windows 构建工作流
#  真正被 GitHub Actions 使用的是仓库根目录的
#  .github/workflows/build-windows.yml，本文件为模板副本，
#  供复用到其它仓库时参考。逻辑完全一致：
#   - windows-latest + Python 3.11
#   - packaging/ci/build.ps1 完成 ffmpeg 下载、打包、安装包生成
# ============================================================
name: Windows Build (模板)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建
        shell: powershell
        run: |
          $ver = (git tag --list 'v*' --sort=-v:refname 2>$null | Select-Object -First 1)
          if ($ver) { $ver = $ver.TrimStart('v') } else { $ver = "1.0.0" }
          powershell -ExecutionPolicy Bypass -File packaging\ci\build.ps1 -Version $ver

      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup
          path: dist_installer/*.exe
