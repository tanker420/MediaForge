name: 构建 Windows 安装程序

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\ci\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Windows-Setup
          path: dist_installer/*
