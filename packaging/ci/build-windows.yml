name: 构建 Windows 安装程序与发布

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\ci\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Windows-Setup
          path: dist_installer/*
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist_installer/*
          generate_release_notes: true
