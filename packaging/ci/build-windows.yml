# ============================================================
#  [参考模板] MediaForge 构建发布工作流
#  真正被 GitHub Actions 使用的是仓库根目录的
#  .github/workflows/build-windows.yml，本文件为模板副本，
#  供复用到其它仓库时参考。逻辑一致：
#   1. build-windows   → windows-latest 构建 Windows 安装包
#   2. build-android   → ubuntu-latest 构建 Android APK
#   3. release         → 推送 v* 标签时汇总两者发布 Release
#  安卓签名：优先 Secret ANDROID_KEYSTORE_BASE64（base64 的
#  android/release.keystore，alias/password 为 mediaforge）；
#  未配置时 CI 现场生成一次性密钥（可安装，但与本地签名不连续）。
# ============================================================
name: 构建 Windows 安装包与 Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（默认取最新 v* 标签；仅 Windows 构建使用）"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 执行构建脚本
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $tag = git tag --list 'v*' --sort=-v:refname 2>$null | Select-Object -First 1
            if ($tag) { $ver = $tag.TrimStart('v') } else { $ver = "1.0.0" }
          }
          $pfx = ""
          if (-not [string]::IsNullOrWhiteSpace("${{ env.CODE_SIGNING_PFX_BASE64 }}")) {
            $pfx = Join-Path $env:RUNNER_TEMP "mediaforge_signing.pfx"
            [System.Text.Encoding]::UTF8.GetString(
              [System.Convert]::FromBase64String("${{ env.CODE_SIGNING_PFX_BASE64 }}")
            ) | Set-Content -LiteralPath $pfx -Encoding Byte -NoNewline
          }
          $pw = "${{ env.CODE_SIGNING_PFX_PASSWORD }}"
          powershell -ExecutionPolicy Bypass -File packaging\ci\build.ps1 `
            -Version $ver -PfxPath $pfx -PfxPassword $pw
          if ($pfx) { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }

      - name: 上传安装包（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup
          path: dist_installer/*.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 34 平台与构建工具（缺失时）
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "使用 Secret ANDROID_KEYSTORE_BASE64 签名（与本地密钥一致）"
          else
            keytool -genkeypair -v -keystore android/release.keystore \
              -alias mediaforge -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mediaforge -keypass mediaforge \
              -dname "CN=MediaForge, OU=MediaForge, O=MediaForge, L=CN, ST=CN, C=CN" \
              > /dev/null 2>&1
            echo "未配置签名 Secret，已生成 CI 一次性密钥（与本地签名不一致，覆盖升级需先卸载旧版）"
          fi

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 构建 release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: 上传 APK（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 收集 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: MediaForge-Setup
          path: release_assets

      - name: 收集 Android APK
        uses: actions/download-artifact@v4
        with:
          name: MediaForge-APK
          path: release_assets

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
